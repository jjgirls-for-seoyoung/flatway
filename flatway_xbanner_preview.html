<!DOCTYPE html>
<html lang="ko">
<head>

  <style>
    body {
      margin: 0;

      background-color: #001E2B; /* MongoDB brand-teal-deep */
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #FFFFFF;
    }
    .header-info {
      text-align: center;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: #00ED64;
      color: #001E2B;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 16px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }
    .header-info h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      color: #FFFFFF;
    }
    .header-info p {
      margin: 0;
      color: #C3F0D2;
      font-size: 15px;
    }
    .download-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 9999px; /* MongoDB signature pill button */
      font-weight: 700;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #00ED64; /* MongoDB brand-green */
      color: #001E2B;
    }
    .btn-primary:hover {
      background: #00b545;
    }
    .btn-secondary {
      background: transparent;
      color: #FFFFFF;
      border: 1px solid #1C2D38;
    }
    .btn-secondary:hover {
      background: #003D4F;
      border-color: #00ED64;
    }
    .banner-container {
      width: 100%;
      max-width: 600px;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 237, 100, 0.2);
      overflow: hidden;
    }
    .banner-img {
      width: 100%;
      height: auto;
      display: block;
    }

<body>
  <div class="header-info">

  <div class="download-bar">
